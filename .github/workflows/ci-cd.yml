name: CI and publish image

on:
  push:
    branches: [main, "audit/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build and start the app
        run: docker compose up --build --detach

      - name: Wait for app health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:5000/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1

      - name: Verify the Redis visit counter
        run: |
          first=$(curl --fail --silent http://localhost:5000/ | sed -n 's/.*<strong>\([0-9][0-9]*\)<\/strong>.*/\1/p')
          second=$(curl --fail --silent http://localhost:5000/ | sed -n 's/.*<strong>\([0-9][0-9]*\)<\/strong>.*/\1/p')
          echo "First visit count: $first"
          echo "Second visit count: $second"
          test -n "$first" && test "$second" -gt "$first"

      - name: Clean up
        if: always()
        run: docker compose down --volumes || true

  publish:
    needs: smoke-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GH_USER" --password-stdin

      - name: Build and publish image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          docker build -t "$IMAGE_NAME:$IMAGE_TAG" -t "$IMAGE_NAME:latest" .
          docker push "$IMAGE_NAME:$IMAGE_TAG"
          docker push "$IMAGE_NAME:latest"
